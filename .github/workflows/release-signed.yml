name: Signed Release APK

# House rule: releases are always signed with the stable upload key so they
# update seamlessly; debug builds keep the debug key (+ .debug suffix).
# The upstream debug workflow is left alone; this file owns signed releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore Upload Key
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/dailytrade-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Signed Release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          DT_KEYSTORE: /tmp/dailytrade-release.jks
          DT_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          DT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyTrade-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
